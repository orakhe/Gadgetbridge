name: Rotador APK

on:
  push:
    branches: [ rotador ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Vendor greenDAO generator from upstream
        run: |
          git clone -q --depth 1 https://codeberg.org/Freeyourgadget/Gadgetbridge.git /tmp/up
          cp -r /tmp/up/GBDaoGenerator/src/de GBDaoGenerator/src/
          fm=$(grep -rhoE "org\.freemarker:freemarker:[0-9.]+" /tmp/up/GBDaoGenerator /tmp/up/gradle 2>/dev/null | head -1)
          if [ -z "$fm" ]; then fm=$(grep -rhoE 'freemarker *= *"[0-9.]+"' /tmp/up/gradle 2>/dev/null | head -1 | grep -oE "[0-9.]+" | sed 's/^/org.freemarker:freemarker:/'); fi
          [ -n "$fm" ] && sed -i "s/org.freemarker:freemarker:[0-9.]*/$fm/" GBDaoGenerator/build.gradle
          mkdir -p GBDaoGenerator/src-template
          find /tmp/up/GBDaoGenerator -name "*.ftl" -exec cp {} GBDaoGenerator/src-template/ \;
          echo "freemarker: $fm"; find /tmp/up/GBDaoGenerator -name "*.ftl"; grep -rn "TemplateLoading" GBDaoGenerator/src/de || true
      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleMainlineDebug > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|FAILURE|What went wrong|wrong:|Exception|e: " build.log | grep -v "^\s*at " | head -25; echo ----; tail -15 build.log)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
            echo "::error title=Gradle::$msg"
            git config user.name "rotador-ci"
            git config user.email "rotador-ci@users.noreply.github.com"
            cp build.log /tmp/build.log
            git checkout -q --orphan ci-log
            git rm -rq --cached .
            cp /tmp/build.log build-${{ github.run_number }}.log
            git add build-${{ github.run_number }}.log
            git commit -qm "build log ${{ github.run_number }}"
            git push -f origin ci-log || true
          fi
          exit $code
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/mainline/debug/*.apk GadgetbridgeRotador.apk
          ls -la GadgetbridgeRotador.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rotador-${{ github.run_number }}
          name: Rotador ${{ github.run_number }}
          make_latest: true
          files: GadgetbridgeRotador.apk
