name: Rotador APK

on:
  push:
    branches: [ rotador ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleMainlineDebug
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/mainline/debug/*.apk GadgetbridgeRotador.apk
          ls -la GadgetbridgeRotador.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rotador-${{ github.run_number }}
          name: Rotador ${{ github.run_number }}
          make_latest: true
          files: GadgetbridgeRotador.apk
