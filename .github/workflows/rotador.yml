name: Rotador APK

on:
  push:
    branches: [ rotador ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleMainlineDebug 2>&1 | tee build.log
      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "rotador-ci"
          git config user.email "rotador-ci@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || echo "no build log (failed before gradle)" > /tmp/build.log
          git checkout --orphan ci-log
          git rm -rq --cached .
          cp /tmp/build.log build-${{ github.run_number }}.log
          git add build-${{ github.run_number }}.log
          git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-log
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/mainline/debug/*.apk GadgetbridgeRotador.apk
          ls -la GadgetbridgeRotador.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rotador-${{ github.run_number }}
          name: Rotador ${{ github.run_number }}
          make_latest: true
          files: GadgetbridgeRotador.apk
